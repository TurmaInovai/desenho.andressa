<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Virtual Pet</title>
    <!-- Use a cute dynamic font -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Áudio de fundo -->
    <audio id="bg-music" loop>
        <!-- Aviso: O arquivo veigh_bolsa_de_ombro.mp3 tem que ser colocado na mesma pasta -->
        <source src="veigh_bolsa_de_ombro.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container" class="scene-living-room">
        <header style="position: relative;">
            <button id="music-btn" onclick="toggleMusic()" style="position: absolute; right: 10px; top: -5px; background: none; border: none; font-size: 24px; cursor: pointer; z-index: 100;" title="Tocar Música">🔇</button>
            <div class="stat">
                <label>Fome</label>
                <div class="bar-bg"><div class="bar-fill" id="fome-bar"></div></div>
            </div>
            <div class="stat">
                <label>Higiene</label>
                <div class="bar-bg"><div class="bar-fill" id="higiene-bar"></div></div>
            </div>
            <div class="stat">
                <label>Energia</label>
                <div class="bar-bg"><div class="bar-fill" id="energia-bar"></div></div>
            </div>
            <div class="stat">
                <label>Alegria</label>
                <div class="bar-bg"><div class="bar-fill" id="alegria-bar"></div></div>
            </div>
        </header>

        <main id="scene">
            <h2 id="scene-title">Sala de Estar</h2>
            <div id="pet-container">
                <img src="hello_kitty.png" alt="Pet" id="pet-img">
                <div id="status-fx"></div>
            </div>
            
            <div id="kitchen-foods" class="actions-panel hidden">
                <button class="food-btn" onclick="feedPet('melancia')">🍉 Melancia</button>
                <button class="food-btn" onclick="feedPet('chocolate')">🍫 Chocolate</button>
                <button class="food-btn" onclick="feedPet('maca')">🍎 Maçã</button>
                <button class="food-btn" onclick="feedPet('sorvete')">🍦 Sorvete</button>
            </div>

            <div id="play-panel" class="actions-panel hidden">
                <button class="action-btn play-btn" onclick="playWithPet()">🎾 Jogar Bolinha</button>
                <button class="action-btn mic-btn" id="mic-btn" onclick="toggleMicrophone()">🎤 Repetir Voz</button>
            </div>
            <div id="bath-panel" class="actions-panel hidden">
                <button class="action-btn bath-btn" onclick="bathePet()">🛁 Dar Banho</button>
            </div>
            <div id="sleep-panel" class="actions-panel hidden">
                <button class="action-btn sleep-btn" onclick="sleepPet()">🛏 Apagar as Luzes</button>
            </div>
        </main>

        <footer>
            <button class="nav-btn active" onclick="changeScene('living-room', this)">🏠 Sala</button>
            <button class="nav-btn" onclick="changeScene('kitchen', this)">🍳 Cozinha</button>
            <button class="nav-btn" onclick="changeScene('bathroom', this)">🛁 Banho</button>
            <button class="nav-btn" onclick="changeScene('bedroom', this)">🛏 Quarto</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
